name: soh
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - h5py>=3.10,<4.0
  - matplotlib>=3.8,<4.0
  - numpy>=1.24,<2.0
  - pandas>=2.1,<3.0
  - scipy>=1.11,<2.0
  - seaborn>=0.13,<1.0
  - optuna>=3.5,<4.0
  - pyyaml>=6.0,<7.0
  - scikit-learn>=1.4,<2.0
  - shap>=0.44,<1.0
  # PyTorch: install the build matching your platform. On macOS the
  # conda-forge default ships MPS support; on CUDA machines prefer the
  # official wheel index (https://pytorch.org/get-started/locally/).
  - pytorch>=2.2,<3.0
  - pip:
      - mlflow>=3.14,<4.0
      - captum>=0.7,<1.0
      - openpyxl>=3.1,<4.0
      - xlrd>=2.0,<3.0
      - joblib>=1.3,<2.0
      # --- dev tools ---
      - pytest>=8.0,<9.0
      - pytest-cov>=5.0,<6.0
      - ruff>=0.3
      - mypy>=1.8,<2.0
