[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soh-estimation"
version = "0.1.0"
description = "ML/DL benchmark study for State of Health estimation of lithium-ion EV batteries"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10, <3.12"
authors = [
    {name = "Malak M."}
]
dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.1,<3.0",
    "scipy>=1.11,<2.0",
    "scikit-learn>=1.4,<2.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "optuna>=3.5,<4.0",
    "torch>=2.2,<3.0",
    "mlflow>=3.14,<4.0",
    "shap>=0.44,<1.0",
    "captum>=0.7,<1.0",
    "h5py>=3.10,<4.0",
    "pyyaml>=6.0,<7.0",
    "openpyxl>=3.1,<4.0",
    "xlrd>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.3,<0.6",
    "black>=24.0,<25.0",
    "mypy>=1.8,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501", "N803", "N806", "N802"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
